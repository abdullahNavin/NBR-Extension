<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background: #fff;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
    .version { font-size: 10px; color: #999; font-weight: 500; }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #e5e5e5;
    }
    .avatar-fallback {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-fallback svg { width: 16px; height: 16px; fill: #999; }
    .profile-text { min-width: 0; }
    .profile-name {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-email {
      font-size: 10px;
      color: #888;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .license-card {
      background: #F5F5F7;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .license-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .license-label { font-size: 11px; font-weight: 500; color: #555; }
    .status-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: capitalize;
    }
    .status-trial   { background: #FEF3C7; color: #92400E; }
    .status-active  { background: #D1FAE5; color: #065F46; }
    .status-expired { background: #FEE2E2; color: #991B1B; }
    .status-revoked { background: #FEE2E2; color: #991B1B; }
    .progress-wrap { margin-top: 10px; }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1a1a1a;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress-text { font-size: 10px; color: #888; margin-top: 4px; }
    .status-msg { font-size: 10px; margin-top: 8px; line-height: 1.4; }
    .status-msg-muted { color: #888; }
    .status-msg-alert { color: #991B1B; }

    .actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .actions a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
      border: 1px solid transparent;
    }
    .btn-secondary { background: #F5F5F7; color: #333; border-color: #e0e0e0; }
    .btn-secondary:hover { background: #ececec; }
    .btn-primary { background: #1a1a1a; color: #fff; }
    .btn-primary:hover { background: #333; }

    .footer {
      border-top: 1px solid #e5e5e5;
      padding-top: 10px;
      text-align: center;
    }
    .btn-signout {
      background: none;
      border: none;
      font-size: 11px;
      color: #999;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.15s;
      font-family: inherit;
    }
    .btn-signout:hover { color: #666; }

    .login-view { padding: 8px 0 4px; text-align: center; }
    .login-view p { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.5; }
    .btn-google {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }
    .btn-google:hover { background: #f9f9f9; border-color: #ccc; }
    .error { color: #991B1B; font-size: 11px; margin-top: 8px; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>NBR Auto Sum</h1>
    <span class="version">v3.2.0</span>
  </div>

  <!-- Login state -->
  <div id="loginView">
    <div class="login-view">
      <p>Sign in with Google to activate your license.</p>
      <button id="loginBtn" class="btn-google">
        <svg width="14" height="14" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div id="loginError" class="error hidden"></div>
    </div>
  </div>

  <!-- Logged-in state -->
  <div id="mainView" class="hidden">
    <div class="profile">
      <img id="userAvatar" class="avatar hidden" src="" alt="">
      <div id="avatarFallback" class="avatar-fallback">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v1.2c0 .66.54 1.2 1.2 1.2h16.8c.66 0 1.2-.54 1.2-1.2v-1.2c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </div>
      <div class="profile-text">
        <div id="userName" class="profile-name"></div>
        <div id="userEmail" class="profile-email"></div>
      </div>
    </div>

    <div id="licenseCard" class="license-card">
      <div class="license-row">
        <span class="license-label">License</span>
        <span id="statusBadge" class="status-pill"></span>
      </div>
      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div id="usageInfo" class="progress-text"></div>
      </div>
      <div id="statusMessage" class="status-msg hidden"></div>
    </div>

    <div class="actions">
      <a href="#" id="nbrBtn" class="btn-secondary">Portal</a>
      <a href="#" id="buyLicense" class="btn-secondary">Buy License</a>
    </div>

    <div class="footer">
      <button id="logoutBtn" class="btn-signout">Sign out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
